<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A²LAB · AI 품질 예측 · 공정 최적화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('a2lab.theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
/* 디자인: ARCON / AI 오케스트레이션 플랫폼과 같은 결 — 기본 다크, 어두운 사이드바, 하늘색 포인트, 라이트 테마 전환 */
:root{
  --bg:#060A13; --bg-grad:radial-gradient(1200px 600px at 85% -10%, rgba(56,189,248,.08), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(129,140,248,.07), transparent 60%);
  --surface:#0C1322; --surface2:#111A2C; --surface3:#16213A; --ink:#E6EDF7; --ink2:#C3CEE0; --muted:#8293AE; --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --accent:#38BDF8; --accent2:#22D3EE; --accent-ink:#04121C; --accent-soft:rgba(56,189,248,.12);
  --rail:#070C17; --rail-line:rgba(148,163,184,.10); --rail-ink:#C8D3E6; --rail-muted:#6E7F9C; --rail-active:linear-gradient(90deg, rgba(56,189,248,.22), rgba(56,189,248,.06));
  --ok:#34D399; --warn:#FBBF24; --crit:#FB7185; --info:#818CF8;
  --ok-soft:rgba(52,211,153,.12); --warn-soft:rgba(251,191,36,.12); --crit-soft:rgba(251,113,133,.12); --info-soft:rgba(129,140,248,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --f-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --grid-c:#26375c; --ax:#8293AE;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F7FB; --bg-grad:radial-gradient(1100px 500px at 90% -20%, rgba(37,99,235,.06), transparent 60%);
  --surface:#FFFFFF; --surface2:#F8FAFC; --surface3:#F1F5F9; --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#2563EB; --accent2:#0891B2; --accent-ink:#FFFFFF; --accent-soft:#EFF6FF;
  --ok:#059669; --warn:#B45309; --crit:#E11D48; --info:#4F46E5;
  --ok-soft:#ECFDF5; --warn-soft:#FFFBEB; --crit-soft:#FFF1F2; --info-soft:#EEF2FF;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px -8px rgba(15,23,42,.08);
  --grid-c:#E2E8F0; --ax:#64748B;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) fixed;background-image:var(--bg-grad);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
:root[lang="ja"] body,:root[lang="ko"] body{line-break:strict}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- 로그인 ---- */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--bg);background-image:var(--bg-grad)}
#login .box{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 32px 28px;box-shadow:var(--shadow);position:relative}
#login .lang-top{position:absolute;right:16px;top:16px}
#login h1{font-size:22px;margin:16px 0 4px;letter-spacing:-.02em}
#login p.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
#login .btn.primary{width:100%;justify-content:center;height:46px;margin-top:20px;font-size:15px}
#login .foot{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center}
#login .input{width:100%}

/* ---- 틀 ---- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
body.fold .app{grid-template-columns:0 minmax(0,1fr)}
body.fold .rail{padding:0;border:0;overflow:hidden}
.rail{background:var(--rail);border-right:1px solid var(--rail-line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;color:var(--rail-ink);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 4px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0EA5E9,#6366F1);box-shadow:0 6px 18px -6px rgba(56,189,248,.55);flex:none}
.logo svg{width:19px;height:19px}
.brand .bt{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:16px;letter-spacing:-.02em;color:#F1F5F9}
#login .brand b{color:var(--ink)}
.brand .bt span{font-size:11.5px;color:var(--rail-muted)}
.tenant{display:grid;gap:3px;padding:10px 12px;border-radius:12px;background:rgba(148,163,184,.06);border:1px solid var(--rail-line);font-size:12px}
.tenant .tl1{display:flex;justify-content:space-between;color:var(--rail-muted);font-size:11px}
.tenant .okk{display:inline-flex;align-items:center;gap:4px;color:#34D399}
.tenant .tl2{color:#E2E8F0;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--rail-muted);padding:6px 10px;text-transform:uppercase}
.grp>button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--rail-ink);cursor:pointer;text-align:left}
.grp>button:hover{background:rgba(148,163,184,.08);color:#fff}
.grp>button svg.i{color:var(--rail-muted)}
.grp>button .nl{display:flex;flex-direction:column;min-width:0;line-height:1.3;flex:1}
.grp>button .nl span{font-size:13.5px;font-weight:600}
.grp>button .nl small{font-size:11px;color:var(--rail-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp>button .car{width:14px;height:14px;transition:transform .15s}
.grp.open>button .car{transform:rotate(90deg)}
.grp.has>button{background:var(--rail-active);color:#fff}
.grp.has>button svg.i:first-child{color:#38BDF8}
.grp .items{display:none;padding:2px 0 6px 10px;margin-left:18px;border-left:1px solid var(--rail-line)}
.grp.open .items{display:block}
.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;color:#AEBBD1;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.mi:hover{background:rgba(148,163,184,.08);color:#fff}
.mi.on{background:rgba(56,189,248,.14);color:#fff;font-weight:600}
.mi.on::before{content:"";position:absolute;left:-11px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#38BDF8;box-shadow:0 0 12px #38BDF8}
.scope{margin-top:auto;border:1px solid var(--rail-line);border-radius:12px;padding:12px;font-size:12px;display:grid;gap:9px;background:rgba(148,163,184,.05)}
.scope .who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#04121C;background:linear-gradient(135deg,#7DD3FC,#A5B4FC);flex:none}
.scope .wn{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.scope .wn b{color:#F1F5F9;font-size:13px}
.scope .wn small{color:var(--rail-muted);font-size:11px}
.scope .lo{border:1px solid var(--rail-line);background:#0B1324;color:#C8D3E6;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;justify-content:center}
.scope .lo:hover{border-color:#38BDF8}

.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:12px 28px;background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb svg{width:14px;height:14px}
.tsearch{flex:1;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.tsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tsearch>svg{color:var(--accent)}
.tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13.5px}
.tsearch input::placeholder{color:var(--muted)}
.sres{position:absolute;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px -16px rgba(0,0,0,.6);padding:6px;max-height:360px;overflow:auto;z-index:30}
.sres button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--accent-soft)}
.sres small{color:var(--muted)}
.tacts{display:flex;align-items:center;gap:8px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#F43F5E;box-shadow:0 0 8px #F43F5E}
.langsw{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink2)}
.langsw>svg{width:15px;height:15px;margin-right:4px;color:var(--muted)}
.langsw button{min-width:30px;height:28px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-weight:600;font-size:12px;cursor:pointer}
.langsw button:hover{color:var(--ink)}
.langsw button.on{background:var(--accent);color:var(--accent-ink)}
.wtabs{display:flex;gap:4px;padding:8px 28px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.wtab{display:flex;align-items:center;gap:6px;padding:8px 10px 9px 12px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.wtab:hover{color:var(--ink)}
.wtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.wtab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted);font-weight:400}
.wtab .x:hover{background:var(--surface3);color:var(--ink)}
main{padding:22px 28px 56px;min-width:0;width:100%}

/* ---- 공통 컴포넌트 ---- */
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.3}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.015em}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.head .ey{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px;padding:0 6px}
.lede{color:var(--muted);margin:2px 0 0;max-width:90ch;font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;flex-wrap:wrap}
.panel>header .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.panel .pb{padding:0 18px 16px;min-width:0}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.dash{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.cond{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;box-shadow:var(--shadow);margin:0}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:12px;color:var(--muted);font-weight:600}
.input{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;outline:none;min-width:150px;height:36px;font-size:13px;color:var(--ink);font-weight:400}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{opacity:.6}
.rng{display:flex;align-items:center;gap:6px}
.rng .input{min-width:140px}
.dwrap{position:relative;display:inline-flex}.dwrap .input{padding-right:34px;font-variant-numeric:tabular-nums}.dwrap .dpk{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}.dwrap .dpk:hover{color:var(--accent);background:var(--accent-soft)}.dwrap .dhid{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:0 14px;height:36px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft)}
.btn.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.btn.blue{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.btn.big{height:46px;padding:0 18px;font-size:14px}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.p-crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.p-info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.p-line{border-color:var(--line2);color:var(--ink2);background:var(--surface2)}
.note{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--accent);padding:2px 0 2px 10px}

/* 표 */
.tablewrap{overflow:auto;max-height:520px;border-top:1px solid var(--line)}
.tablewrap.short{max-height:340px}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.g th,table.g td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.g th{font-size:11.5px;letter-spacing:.03em;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
table.g th:hover{color:var(--ink)}
table.g th .srt{color:var(--accent);margin-left:4px;font-size:10px}
table.g td{max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.g tbody tr{transition:background .12s;cursor:pointer}
table.g tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
table.g tbody tr.sel{background:var(--accent-soft)}
table.g td.n,table.g th.n{text-align:right}
table.g td.c{text-align:center}
table.g .rn{width:44px;text-align:center;color:var(--muted)}
table.g .ck{width:36px;text-align:center}
table.g tfoot td{position:sticky;bottom:0;background:var(--surface3);font-weight:700;border-top:1px solid var(--line2)}
table.g input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
table.g select.cell{height:28px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:0 6px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pg{display:flex;gap:4px}
.pg button{min-width:28px;height:26px;border:1px solid var(--line);background:var(--surface2);border-radius:7px;cursor:pointer;font-size:12px}
.pg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle}
.loading{opacity:.35;transition:opacity .15s}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kvs div{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface2);min-width:0}
.kvs span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.kvs b{font-size:16px;overflow-wrap:anywhere}

/* 대시보드 */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;color:#E2E8F0;background:linear-gradient(120deg,#0B1222 0%,#0F1B33 45%,#1E1B4B 100%);border:1px solid rgba(148,163,184,.16);box-shadow:0 20px 40px -24px rgba(2,6,23,.8)}
.hero::after{content:"";position:absolute;right:-80px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(56,189,248,.28),transparent);pointer-events:none}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7DD3FC;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);border-radius:999px;padding:4px 11px}
.hero h1{color:#F8FAFC;margin-top:12px;font-size:27px}
.hero p{color:#A9B6CC;margin:8px 0 0;max-width:72ch}
.hero .hstats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative;z-index:1}
.hero .hstat{display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:8px 12px;font-size:12.5px;color:#CBD5E1}
.hero .hstat b{font-size:15px;color:#fff}
.hero .hstat i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.kgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:18px 20px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--kc) 28%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 11%,var(--surface)) 0%,var(--surface) 60%);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit}
.kcard:hover{border-color:color-mix(in srgb,var(--kc) 55%,transparent)}
.kcard .ki{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);box-shadow:0 0 18px -4px var(--kc)}
.kcard .kl{font-size:12.5px;font-weight:700;color:var(--muted)}
.kcard .kv{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:6px}
.kcard .kd{font-size:12px;color:var(--muted)}
.kcard .kd.up{color:var(--ok)}.kcard .kd.down{color:var(--crit)}
.chart{width:100%;display:block}
.chart text{font-size:11px;fill:var(--ax);font-family:var(--f-sans)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 2px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 60%,transparent),var(--accent))}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;background:var(--surface2);cursor:pointer}
.alert:hover{border-color:var(--line2)}
.alert .sev{align-self:stretch;border-radius:0 3px 3px 0;background:var(--sc);box-shadow:0 0 12px var(--sc)}
.alert b{display:block;font-size:13.5px}
.alert p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%}
.lamp.g{background:#34D399;box-shadow:0 0 10px #34D399}.lamp.y{background:#FBBF24;box-shadow:0 0 10px #FBBF24}.lamp.r{background:#FB7185;box-shadow:0 0 10px #FB7185}.lamp.o{background:#64748B}
.monh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clk{margin-left:auto;font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--accent)}
.linecard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit}
.linecard:hover{border-color:var(--accent)}
.linecard h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.linecard .rings{display:flex;justify-content:space-around}
.linecard ul{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}
.linecard li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.bigp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:center;padding:20px}
.bigp .img{background:var(--surface2);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;min-height:270px}
.bigp dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 18px;align-items:center}
.bigp dt{color:var(--muted);font-size:15px}
.bigp dd{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.bigp dd.q{font-size:58px;color:var(--accent);font-family:var(--f-mono)}
.popbadge{display:inline-flex;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:999px;padding:1px 9px}
.plan svg{width:100%;height:auto;display:block}
.plan .rm rect.box{fill:var(--surface2);stroke:var(--line2)}
.plan .rm:hover rect.box{stroke:var(--accent)}

/* 모달·토스트 */
#mask{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:16px;width:780px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.modal.sm{width:440px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15px}
.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal ol{margin:0;padding-left:20px;line-height:1.9;color:var(--ink2)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .input{width:100%}
.doc{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:var(--surface2)}
.doc h4{text-align:center;font-size:18px;margin:0 0 14px}
.scale{background:#060A13;border:1px solid var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;color:#8293AE}
.scale b{font-family:var(--f-mono);font-size:44px;color:#38BDF8}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--surface3);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:13px;box-shadow:0 12px 32px -12px rgba(0,0,0,.6);animation:tin .2s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media print{.rail,.topbar,.wtabs,#mask .modal-f{display:none}}
@media (max-width:1100px){.topbar{padding:10px 18px}main{padding:18px 18px 56px}.wtabs{padding:6px 18px 0}}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:40;width:280px;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.navopen .rail{transform:none}
  .crumb{display:none}
  .dash>*{grid-column:span 12}
  .grid2,.formgrid{grid-template-columns:minmax(0,1fr)}
  .bigp{grid-template-columns:minmax(0,1fr)}
  .langsw>svg{display:none}
}

/* ---- AI 품질예측 전용 ---- */
.pv{display:grid;gap:14px;grid-template-columns:minmax(220px,1.1fr) repeat(4,minmax(0,1fr))}
.pcard{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard span{font-size:12.5px;font-weight:700;color:var(--muted)}
.pcard b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pcard b.sm{font-size:19px}
.pbig{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:#fff;min-height:132px;box-shadow:0 14px 34px -18px var(--pc);background:linear-gradient(140deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#0B1222))}
.pbig span{font-size:13px;font-weight:700;opacity:.85}
.pbig b{font-size:46px;font-weight:900;letter-spacing:.02em;line-height:1}
.pbig small{font-size:12px;opacity:.85}
.pbig.ok{--pc:#10B981}.pbig.ng{--pc:#F43F5E}.pbig.none{--pc:#475569}
.vok{color:var(--ok)}.vng{color:var(--crit)}
.strip{display:flex;gap:2px;align-items:flex-end;height:26px;margin:4px 0 2px}
.strip i{flex:1;border-radius:2px;background:var(--ok);opacity:.75;height:100%;cursor:pointer}
.strip i.ng{background:var(--crit);opacity:1}
.strip i.mis{outline:2px solid var(--warn);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f-mono)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.optg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.opt span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.opt b{font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.opt small{font-size:11.5px;color:var(--muted)}
.opt .delta{font-size:11.5px;font-weight:700}
.smalls{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.mini{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:10px 12px 6px;min-width:0}
.mini h3{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);color:var(--ink2);font-weight:600;overflow-wrap:anywhere}
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(2,6,23,.45);backdrop-filter:blur(2px)}
.busy div{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:22px 28px;font-weight:700}
.busy svg{width:38px;height:38px;animation:spin 1s linear infinite;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.dash4{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.dpanel{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.dpanel .dh{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dpanel .dh h2{font-size:15px}
.dpanel .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dpanel .trio div,.dpanel .when{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2);min-width:0}
.dpanel .trio span,.dpanel .when span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.dpanel .trio b{font-size:17px}
.dpanel .when b{font-size:14px;font-variant-numeric:tabular-nums}
.dpanel .pbig{min-height:96px}
.dpanel .pbig b{font-size:38px}
.dpanel .input{min-width:0}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch;font-size:12.5px}
.cm .h{display:grid;place-items:center;color:var(--muted);font-weight:700;padding:4px}
.cm .c{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 8px;font-weight:700;min-height:92px}
.cm .c b{font-size:26px}
.cm .c small{font-weight:600;opacity:.8}
.hm text{font-size:9.5px;fill:var(--ax);font-family:var(--f-mono)}
.hm rect.cell:hover{stroke:var(--ink);stroke-width:1.5}
.scale-bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:8px}
.scale-bar i{display:block;width:200px;height:10px;border-radius:5px;background:linear-gradient(90deg,#F43F5E,var(--surface3),#38BDF8)}
@media (max-width:1280px){.dash4{grid-template-columns:repeat(2,minmax(0,1fr))}.pv{grid-template-columns:repeat(2,minmax(0,1fr))}.pv .pbig{grid-column:span 2}}
@media (max-width:920px){.dash4{grid-template-columns:minmax(0,1fr)}.smalls{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.topbar{flex-wrap:wrap;padding:10px 16px;gap:10px}.tsearch{order:5;flex:1 1 100%;max-width:none;margin:0}.tacts{margin-left:auto;gap:6px}.topbar>*{min-width:0}}

<script>

const PROC = [

];
const P = Object.fromEntries(PROC.map(p => [p.k, p]));
const feat = tag => tag==='TIME_PER_STRING' ? 'TIME_PER_STRINGs' : tag;
PROC.forEach(p => { p.means = p.tags.map(x => feat(x)+'_mean'); p.feats = p.tags.flatMap(x => tag2feats(x)); });
function tag2feats(x){ return x==='TIME_PER_STRING' ? ['TIME_PER_STRINGs_mean'] : [x+'_std', x+'_mean']; }
function base(tag){
  if (/BOTTOMPLATE/.test(tag)) return {m:182+(hash(tag)%5)-2, s:1.4, d:1};
  if (/TIME_PER_STRING/.test(tag)) return {m:21.4, s:.6, d:2};
  if (/MAIN_Z/.test(tag)) return {m:12.5, s:.06, d:3};
  if (/CYCLE_TIME/.test(tag)) return {m:3.2, s:.08, d:2};
  if (/MAX_TEMP/.test(tag)) return {m:382+(hash(tag)%7)-3, s:3.2, d:1};
  if (/PV_TEMP/.test(tag)) return {m:351+(hash(tag)%5)-2, s:2.6, d:1};
  if (/WELDING_HEAD_CV/.test(tag)) return {m:1.82, s:.05, d:3};
  if (/AIR_PRESSURE/.test(tag)) return {m:.552, s:.008, d:3};
  if (/VACUUM/.test(tag)) return {m:96.5, s:.7, d:1};
  if (/HEATER_TANK/.test(tag)) return {m:151, s:1.2, d:1};
  return {m:145+(hash(tag)%6)-3, s:1.6, d:1};
}
const unitOf = f => /_std$/.test(f) ? null : base(f.replace(/_mean$/,'').replace('TIME_PER_STRINGs','TIME_PER_STRING'));
function fval(f, r, ng){ const tag=f.replace(/_(mean|std)$/,'').replace('TIME_PER_STRINGs','TIME_PER_STRING'), b=base(tag);
  if (/_std$/.test(f)) return +(Math.abs(b.s*(.35+.25*r()))*(ng?1.8:1)).toFixed(b.d+1);
  return +(b.m + gauss(r)*b.s*.35 + (ng? b.s*(r()<.5?-1:1)*(1.2+r()) : 0)).toFixed(b.d); }

/* 1분 구간 예측 기록 (설비·시각별로 고정된 가상값) */
function minuteRec(pk, eq, d){
  const r = rng(pk+eq+d.getTime()), ngp = r() < .055, plcNg = r() < .93 ? ngp : !ngp;
  const rec = {TO_TIME:d, pred:ngp?'NG':'OK', plc:plcNg?'NG':'OK'};
  P[pk].means.forEach(f => rec[f] = fval(f, r, ngp));
  return rec;
}
function lastHour(pk, eq){ const end=nowAt(); return range(60, i => minuteRec(pk, eq||'LINE', new Date(end.getTime() - (60-i)*60000))); }

function table(root, mount, cols, rows, opts={}){
  const S = {sort:null, dir:1, page:0, sel:opts.sel||new Set(), active:opts.active};

    if (S.sort!==null){ const c=cols[S.sort]; rs.sort((a,b)=>{const x=a.r[c],y=b.r[c]; return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))*S.dir;}); }
    const pages = Math.max(1, Math.ceil(rs.length/per)); S.page=Math.min(S.page,pages-1);

      <tbody>${view.map(({r,i})=>`<tr data-i="${i}" class="${S.active===i||S.sel.has(i)?'sel':''}">${opts.check?`<td class="ck"><input type="checkbox" data-c="${i}" ${S.sel.has(i)?'checked':''}></td>`:''}<td class="rn">${i+1}</td>${cols.map(c=>{const v=r[c];return `<td class="${typeof v==='number'?'n':''}">${opts.cell?opts.cell(c,v,r):esc(typeof v==='number'?fmt(v):t(v))}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="gfoot"><span>${t('총 {n}건',{n:fmt(rows.length)})}${opts.check?` · ${t('선택 {n}건',{n:S.sel.size})}`:''}</span><div class="pg">${pages>1?Array.from({length:Math.min(pages,9)},(_,p)=>`<button type="button" class="${p===S.page?'on':''}" data-p="${p}">${p+1}</button>`).join(''):''}</div></div>`;
    $$('th[data-s]',el).forEach(th=>th.onclick=()=>{const i=+th.dataset.s; S.dir = S.sort===i?-S.dir:1; S.sort=i; draw();});
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{S.page=+b.dataset.p; draw();});
    $$('[data-c]',el).forEach(c=>c.onclick=e=>{e.stopPropagation(); const i=+c.dataset.c; c.checked?S.sel.add(i):S.sel.delete(i); draw();});
    const all=$('[data-all]',el); if(all) all.onclick=()=>{ if(all.checked) rows.forEach((_,i)=>S.sel.add(i)); else S.sel.clear(); draw(); };
    $$('tbody tr',el).forEach(tr=>tr.onclick=()=>{ const i=+tr.dataset.i; if(opts.onRow){ S.active=i; draw(); opts.onRow(rows[i], i); } else if(opts.check){ S.sel.has(i)?S.sel.delete(i):S.sel.add(i); draw(); } });
  };
  draw(); return S;
}

  if (fields.includes('model')) f.push(fld('모델버전', sel('model', [['','선택하세요'], ...models(p).map(m=>[m.ver,m.ver])], S.model??models(p)[0].ver)));

  return `<form class="cond" onsubmit="return false">${f.join('')}<div class="btns"><button type="button" class="btn primary" data-b="search">${icon('search','width:15px;height:15px')}${t('조회')}</button><button type="button" class="btn" data-b="reset">${t('초기화')}</button>${opts.excel?`<button type="button" class="btn good" data-b="excel">${icon('dl','width:15px;height:15px')}${t('엑셀 다운로드')}</button>`:''}</div></form>`;
}
function readCond(root, S){ $$('select[data-n]',root).forEach(x=>S[x.dataset.n]=x.value); const dt=$('[data-n=date]',root); if(dt){ const d=pdate(dt.value); if(!d){ toast(t('날짜를 연도-월-일 형식으로 입력해 주세요.')); return false; } S.date=dt.value; } if($('[data-n=start]',root)){ const r=readDates(root); if(!r) return false; S.start=ds(r[0]); S.end=ds(r[1]); } return true; }
function shell(s, inner){ const el=document.createElement('div'); el.className='stack'; el.innerHTML = head(s) + inner; $('[data-help]',el).onclick=()=>help(s); return el; }
function bind(el, s, {search, reset, excel}){

  $('[data-b=reset]',el).onclick = () => { STATE[s.id]={}; render(true); toast(t('조회 조건을 초기화했습니다.')); reset&&reset(); };

/* ---------- 가상 데이터: 이력 · 모델 · 데이터셋 ---------- */
function dayStat(pk, eq, d){ const r=rng(pk+eq+ds(d)), tot=1200+Math.floor(r()*230), ng=Math.round(tot*(.018+r()*.04)), plc=Math.max(0,ng+Math.round(gauss(r)*ng*.18)), acc=+(100-Math.abs(ng-plc)/tot*100-(r()*3.2)).toFixed(1); return {'일자':ds(d), '전체예측건수':tot, 'NG 예측':ng, 'PLC NG':plc, '예측정확도':acc}; }
function models(p){ const out=[]; for(let w=0; w<12; w++){ const end=addD(TODAY,-((TODAY.getDay()+6)%7)-1-7*w), start=addD(end,-6), r=rng(p.k+'m'+ds(end)), auc=.935+r()*.05;
  out.push({ver:`model_xgb_${p.k.toLowerCase()}_${ds(addD(end,1)).replace(/-/g,'')}`, start, end, '시작일':ds(start), '종료일':ds(end), '데이터셋 크기':8200+Math.floor(r()*3600), AUC:+auc.toFixed(4), Accuracy:+(auc-.02-r()*.02).toFixed(4), F1:+(auc-.09-r()*.05).toFixed(4), Recall:+(auc-.11-r()*.06).toFixed(4), Precision:+(auc-.06-r()*.05).toFixed(4)}); }
  out.forEach(m=>m['모델명']=m.ver); return out; }
function sampleRows(p, eq, seed, n, cols){ const r=rng(seed); return range(n, i=>{ const ng=r()<.06, row={}; cols.forEach(c=>row[c]=fval(c,r,ng)); row['판정']=ng?'NG':'OK'; return row; }); }
function rawRows(p, eq, d, n){ const r=rng(p.k+eq+ds(d)+'raw'); return range(n, i=>{ const tm=new Date(d); tm.setHours(8,0,0,0); tm.setSeconds(i*17); const row={TIMESTAMP:`${ds(tm)} ${hm(tm)}:${pad(tm.getSeconds())}`, SID:eq||p.k+'_LINE01'}; p.tags.forEach(tg=>{const b=base(tg); row[tg]=+(b.m+gauss(r)*b.s).toFixed(b.d);}); return row; }); }
function rawSeries(p, eq, tag, a, b, n=180){ const r=rng(p.k+eq+tag+ds(a)+ds(b)), bs=base(tag), span=b.getTime()+86400000-a.getTime(); let drift=0;
  return range(n, i=>{ drift = drift*.92 + gauss(r)*bs.s*.25; const v = bs.m + drift + gauss(r)*bs.s*.5 + (r()<.015 ? bs.s*4*(r()<.5?-1:1) : 0); const d=new Date(a.getTime()+span*(i-1)/n); return {l:`${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hm(d)}`, v:+v.toFixed(bs.d+1)}; }); }

/* ---------- 01 실시간 품질 예측 ---------- */
function predCards(last){
  const cls = last ? (last.pred==='OK'?'ok':'ng') : 'none', match = last && last.pred===last.plc;
  return `<div class="pbig ${cls}"><span>${t('실시간 품질 예측')}</span><b>${last?last.pred:'-'}</b><small>${last?t('{t} 구간 예측',{t:hm(last.TO_TIME)}):t('최근 1시간 데이터 없음')}</small></div>
    <div class="pcard"><span>${t('일시')}</span><b class="sm">${last?`${ds(last.TO_TIME)} ${hm(last.TO_TIME)}:00`:'-'}</b></div>
    <div class="pcard"><span>${t('예측')}</span><b class="${last?.pred==='NG'?'vng':'vok'}">${last?.pred||'-'}</b></div>
    <div class="pcard"><span>PLC</span><b class="${last?.plc==='NG'?'vng':'vok'}">${last?.plc||'-'}</b></div>
    <div class="pcard"><span>${t('검증')}</span><b class="${match?'vok':'vng'}">${last?t(match?'일치':'불일치'):'-'}</b></div>`;
}
function strip(recs){ return `<div class="strip">${recs.map(r=>`<i class="${r.pred==='NG'?'ng':''} ${r.pred!==r.plc?'mis':''}" title="${hm(r.TO_TIME)} · ${t('예측')} ${r.pred} · PLC ${r.plc}"></i>`).join('')}</div><div class="legend" style="padding:0"><span><i style="background:var(--ok)"></i>OK</span><span><i style="background:var(--crit)"></i>NG</span><span><i style="background:transparent;outline:2px solid var(--warn)"></i>${t('예측 · PLC 불일치')}</span></div>`; }
function scr01(s){
  const p=s.p, S=st(s.id); S.cols ||= [p.means[p.means.length-1], p.means[0]].filter((x,i,a)=>a.indexOf(x)===i);
  const eq = p.equips ? (S.equip||p.equips[0]) : null;
  const el = shell(s, `${p.equips?`<form class="cond" onsubmit="return false">${fld('설비명', sel('equip', p.equips, eq))}<div class="btns"><span class="pill p-info">${icon('refresh','width:13px;height:13px')}${t('10초마다 자동 갱신')}</span><button type="button" class="btn" data-b="now">${icon('refresh','width:15px;height:15px')}${t('지금 갱신')}</button></div></form>`:`<form class="cond" onsubmit="return false"><span class="pill p-line">${t('라인 단위 예측 (설비 선택 없음)')}</span><div class="btns"><span class="pill p-info">${icon('refresh','width:13px;height:13px')}${t('10초마다 자동 갱신')}</span><button type="button" class="btn" data-b="now">${icon('refresh','width:15px;height:15px')}${t('지금 갱신')}</button></div></form>`}
    <div class="pv" id="cards"></div>
    ${panel('최근 1시간 판정', '<div id="strip"></div>')}
    <section class="panel"><header><h2>${t('실시간 데이터 트렌드')}</h2><span class="meta">${t('컬럼명 (여러 개 선택)')}</span></header><div class="pb"><div class="chips" id="chips">${p.means.map(c=>`<button type="button" class="chip ${S.cols.includes(c)?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div id="trend" style="margin-top:12px"></div></div></section>`);
  const draw = () => { const recs = lastHour(p.k, eq), last=recs[recs.length-1];
    $('#cards',el).innerHTML = predCards(last); $('#strip',el).innerHTML = strip(recs);
    $('#trend',el).innerHTML = S.cols.length ? lineChart({series:S.cols.map(c=>({name:c, values:recs.map(r=>r[c])})), labels:recs.map(r=>hm(r.TO_TIME)), h:300, dec:unitOf(S.cols[0])?.d??2, marks:recs.map(r=>r.pred==='NG')}) : emptyBox('컬럼명을 하나 이상 고르세요.'); };
  draw(); timers.push(setInterval(draw, 10000));
  const se=$('select[data-n=equip]',el); if(se) se.onchange=()=>{ S.equip=se.value; render(true); };
  $('[data-b=now]',el).onclick=()=>{ draw(); toast(t('최신 데이터로 갱신했습니다.')); };
  $$('#chips .chip',el).forEach(b=>b.onclick=()=>{ const c=b.dataset.c; S.cols = S.cols.includes(c) ? S.cols.filter(x=>x!==c) : [...S.cols, c].slice(-6); $$('#chips .chip',el).forEach(x=>x.classList.toggle('on',S.cols.includes(x.dataset.c))); draw(); });

/* ---------- 03 공정 최적값 ---------- */
function scr03(s){
  const p=s.p, S=st(s.id); const flds = p.optBy==='equip'?['equip']:p.optBy==='date'?['date']:[];
  const el=shell(s, condBar(p,s,flds,{excel:true}) + `<section class="panel"><header><h2>${t('공정 최적값 조회')}</h2><span class="meta" id="meta"></span></header><div class="pb" id="opt"></div></section>
    <div class="note">${t('목표 양품 확률 99% 이상 · 변수별 최소 · 최대 허용 범위 안에서 유전 알고리즘으로 탐색한 제안값입니다. 설비 설정 변경은 공정 담당 승인 후 반영합니다.')}</div>`);
  const show = () => { if(!S.res){ $('#opt',el).innerHTML = emptyBox('[조회]를 누르면 최적값 계산을 시작합니다.'); $('#meta',el).textContent=''; return; }
    $('#meta',el).textContent = t('계산 {t} · 양품 확률 {p}%',{t:S.res.at, p:S.res.prob});
    $('#opt',el).innerHTML = `<div class="optg">${S.res.rows.map(r=>{ const dlt=r['현재값']!=null?r['최적값']-r['현재값']:null; return `<div class="opt"><span>${r['변수']}</span><b>${r['최적값']}</b>${r['현재값']!=null?`<small>${t('현재값')} ${r['현재값']} · <span class="delta ${Math.abs(dlt)>(r.s||0)*.5?'vng':'vok'}">${dlt>=0?'+':''}${nf(dlt, r.d)}</span></small>`:''}<small>${t('허용 범위')} ${r['최소']} ~ ${r['최대']}</small></div>`; }).join('')}</div>`; };
  const run = () => busy(1400, () => { const key=p.k+(S.equip||'')+(S.date||''), r=rng(key+'opt'), recs=lastHour(p.k, p.equips?(S.equip||p.equips[0]):null), last=recs[recs.length-1];
    S.res = {at:`${ds(TODAY)} ${hm(nowAt())}`, prob:(99+r()*.8).toFixed(2), rows:p.feats.map(f=>{ const tag=f.replace(/_(mean|std)$/,'').replace('TIME_PER_STRINGs','TIME_PER_STRING'), b=base(tag), isStd=/_std$/.test(f);
      const opt = isStd ? +(b.s*(.15+r()*.15)).toFixed(b.d+1) : +(b.m + gauss(r)*b.s*.2).toFixed(b.d);
      return {'변수':f, '최적값':opt, '현재값': isStd?null:last[f], '최소': isStd?0:+(b.m-b.s*2.5).toFixed(b.d), '최대': isStd?+(b.s*.8).toFixed(b.d+1):+(b.m+b.s*2.5).toFixed(b.d), d:isStd?b.d+1:b.d, s:b.s}; })};
    show(); toast(t('공정 최적값 계산이 끝났습니다.')); });
  bind(el, s, {search:run, excel:()=>{ if(!S.res) return toast(t('저장할 데이터가 없습니다. 먼저 [조회]를 누르세요.')); csv(`${t(p.name)}_${t('공정 최적값')}`, ['변수','최적값','현재값','최소','최대'], S.res.rows); }});
  show(); return el;
}

/* ---------- 04 AI 성능 ---------- */

    $('#cm',el).innerHTML = panel('Confusion Matrix', `<div class="cm"><div></div><div class="h">${t('예측')} OK</div><div class="h">${t('예측')} NG</div><div class="h">${t('실제')} OK</div><div class="c" style="background:var(--ok-soft);color:var(--ok)"><b>${fmt(tn)}</b><small>${t('정상 판정')}</small></div><div class="c" style="background:var(--warn-soft);color:var(--warn)"><b>${fmt(fp)}</b><small>${t('잘못 잡은 NG')}</small></div><div class="h">${t('실제')} NG</div><div class="c" style="background:var(--crit-soft);color:var(--crit)"><b>${fmt(fn)}</b><small>${t('놓친 NG')}</small></div><div class="c" style="background:var(--info-soft);color:var(--info)"><b>${fmt(tp)}</b><small>${t('잡아낸 NG')}</small></div></div>`, esc(m.ver));

  const run = () => { const a=pdate(S.start||ds(addD(TODAY,-84))), b=pdate(S.end||ds(TODAY)); S.rows = models(p).filter(m=>m.end>=a && m.start<=b);

    if(raw) S.rows = dayList(a,b).reverse().map(d=>{ const r=rng(p.k+'raw'+ds(d)), tot=(p.equips?p.equips.length:1)*(4800+Math.floor(r()*600)), ng=Math.round(tot*(.02+r()*.03)); return {'일자':ds(d),'총 데이터 수':tot,'OK':tot-ng,'NG':ng}; });
    else { S.rows=[]; for(let d=addD(b,-((b.getDay()+6)%7)); d>=addD(a,-6); d=addD(d,-7)){ const e=addD(d,6), r=rng(p.k+'ds'+ds(d)), tot=7800+Math.floor(r()*2600), ng=Math.round(tot*(.04+r()*.03)); S.rows.push({'시작일':ds(d),'종료일':ds(e>TODAY?TODAY:e),'총 데이터 수':tot,'OK':tot-ng,'NG':ng}); } }
    table(el,'#top',topCols,S.rows,{per:6, active:0, onRow:row=>showSub(row), short:true}); showSub(S.rows[0]); };
  bind(el, s, {search:run, excel:()=>{ if(!subRows.length) return toast(t('저장할 데이터가 없습니다. 먼저 [조회]를 누르세요.')); const rows = subSel&&subSel.size ? subRows.filter((_,i)=>subSel.has(i)) : subRows; csv(`${t(p.name)}_${t(s.name)}`, subCols, rows); }});
  run(); return el;
}

/* ---------- 08 데이터 시각화 · 09 원본 데이터 시각화 ---------- */
function visual(kind, pts, dec, {h=170, name=''}={}){
  if(kind==='hist') return histChart(pts.map(x=>x.v), {h, dec});
  if(kind==='box') return boxChart([{name, b:boxStats(pts.map(x=>x.v))}], {h:h+40, dec});
  return lineChart({series:[{name:'', values:pts.map(x=>x.v)}], labels:pts.map(x=>x.l), h, dec});
}
function scr08(s){
  const p=s.p, S=st(s.id); const el=shell(s, condBar(p,s,['equip','vis','range'],{back:-6}) + `<div id="out"></div>`);
  const run = () => busy(500, () => { const a=pdate(S.start||ds(addD(TODAY,-6))), b=pdate(S.end||ds(TODAY)), eq=p.equips?(S.equip||p.equips[0]):'LINE', kind=S.vis||'trend';
    $('#out',el).innerHTML = panel(t('{v} · {e}',{v:{trend:'TrendChart',hist:'Histogram',box:'Boxplot'}[kind], e:p.equips?eq:t('라인')}), `<div class="smalls">${p.means.map(m=>{ const tag=m.replace(/_mean$/,'').replace('TIME_PER_STRINGs','TIME_PER_STRING'), bs=base(tag); return `<div class="mini"><h3>${m}</h3>${visual(kind, rawSeries(p,eq,tag,a,b,60).map(x=>({l:x.l,v:+x.v.toFixed(bs.d)})), bs.d, {name:m})}</div>`; }).join('')}</div>`, `${ds(a)} ~ ${ds(b)}`); });
  bind(el, s, {search:run}); run(); return el;
}
function scr09(s){
  const p=s.p, S=st(s.id); const el=shell(s, condBar(p,s,['vis','equip','tag','range'],{back:-1}) + `<div id="out"></div>`);
  const run = () => busy(500, () => { const a=pdate(S.start||ds(addD(TODAY,-1))), b=pdate(S.end||ds(TODAY)), eq=p.equips?(S.equip||p.equips[0]):'LINE', tag=S.tag||p.tags[0], kind=S.vis||'trend', bs=base(tag), pts=rawSeries(p,eq,tag,a,b,240);
    const vs=pts.map(x=>x.v), avg=vs.reduce((x,y)=>x+y,0)/vs.length, sd=Math.sqrt(vs.reduce((x,y)=>x+(y-avg)**2,0)/vs.length);
    $('#out',el).innerHTML = panel(tag, `<div class="kvs" style="margin-bottom:12px"><div><span>${t('평균')}</span><b>${nf(avg,bs.d+1)}</b></div><div><span>${t('표준편차')}</span><b>${nf(sd,bs.d+2)}</b></div><div><span>${t('최소')}</span><b>${nf(Math.min(...vs),bs.d+1)}</b></div><div><span>${t('최대')}</span><b>${nf(Math.max(...vs),bs.d+1)}</b></div><div><span>${t('데이터 수')}</span><b>${fmt(vs.length)}</b></div></div>${visual(kind, pts, bs.d+1, {h:380, name:tag})}`, `${p.equips?eq:t('라인')} · ${ds(a)} ~ ${ds(b)}`); });
  bind(el, s, {search:run}); run(); return el;
}

/* ---------- 10 상관관계 히트맵 ---------- */
function scr10(s){
  const p=s.p, S=st(s.id); const el=shell(s, condBar(p,s,['equip','range'],{back:-6}) + `<div id="out"></div>`);
  const run = () => busy(500, () => { const eq=p.equips?(S.equip||p.equips[0]):'LINE', r=rng(p.k+eq+(S.start||'')+(S.end||'')), names=p.means, n=names.length, fam=x=>x.replace(/\d+/g,'#');
    const M = range(n,()=>Array(n).fill(0)); for(let i=0;i<n;i++) for(let j=i;j<n;j++){ const v = i===j?1 : fam(names[i])===fam(names[j]) ? .45+r()*.5 : (r()-.5)*.7; M[i][j]=M[j][i]=+v.toFixed(2); }
    $('#out',el).innerHTML = panel(t('변수 간 상관계수'), heatmap(names, M), `${p.equips?eq:t('라인')} · ${S.start||ds(addD(TODAY,-6))} ~ ${S.end||ds(TODAY)}`); });
  bind(el, s, {search:run}); run(); return el;
}
const SCREEN_FN = {'01':scr01,'02':scr02,'03':scr03,'04':scr04,'05':scr05,'06':s=>scrDataset(s,false),'07':s=>scrDataset(s,true),'08':scr08,'09':scr09,'10':scr10};

/* ---------- 통합 대시보드 ---------- */
function dashboard(){
  const S=st('DSH-01'); PROC.forEach(p=>{ if(p.equips) S[p.k] ||= p.equips[0]; });
  const el=document.createElement('div'); el.className='stack';
  el.innerHTML = `<section class="hero"><span class="eyebrow">${icon('ok','width:13px;height:13px')}${t('{d} 기준 · 1분마다 갱신',{d:ds(TODAY)})}</span><h1>${t('오늘의 품질 예측 현황')}</h1><p>${t('태빙 · 오토솔더링 · 오토버싱 · 라미네이션 4개 공정의 설비 데이터를 AI가 1분 구간마다 판정합니다.')}</p><div class="hstats" id="hs"></div></section>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" data-b="now">${icon('refresh','width:15px;height:15px')}${t('지금 갱신')}</button><button type="button" class="btn" data-help="1">${icon('help')}${t('화면 도움말')}</button></div>
    <div class="dash4" id="d4"></div>`;
  const draw = () => {
    let tot=0, ng=0, mis=0;
    $('#d4',el).innerHTML = PROC.map(p => { const eq=p.equips?S[p.k]:null, recs=lastHour(p.k,eq), last=recs[recs.length-1], match=last.pred===last.plc;
      recs.forEach(r=>{tot++; if(r.pred==='NG')ng++; if(r.pred!==r.plc)mis++;});
      const cols=p.means.slice(0,4);
      return `<div class="dpanel"><div class="dh"><h2><a href="#" data-open="${p.k}-01" style="color:inherit;text-decoration:none">${icon(p.icon,'width:15px;height:15px;vertical-align:-2px')} ${t(p.name)}</a></h2>${p.equips?sel(p.k, p.equips, eq, 'data-d="1" style="height:30px;min-width:120px"'):`<span class="pill p-line">${t('라인')}</span>`}</div>
        <div class="pbig ${last.pred==='OK'?'ok':'ng'}"><span>${t('실시간 예측')}</span><b>${last.pred}</b></div>
        <div class="when"><span>${t('일시')}</span><b>${ds(last.TO_TIME)} ${hm(last.TO_TIME)}:00</b></div>
        <div class="trio"><div><span>${t('예측')}</span><b class="${last.pred==='NG'?'vng':'vok'}">${last.pred}</b></div><div><span>PLC</span><b class="${last.plc==='NG'?'vng':'vok'}">${last.plc}</b></div><div><span>${t('검증')}</span><b class="${match?'vok':'vng'}" style="font-size:14px">${t(match?'일치':'불일치')}</b></div></div>
        ${strip(recs.slice(-30)).split('<div class="legend"')[0]}
        ${lineChart({series:cols.map(c=>({name:c, values:recs.map(r=>r[c])})), labels:recs.map(r=>hm(r.TO_TIME)), h:170, dec:unitOf(cols[0]).d})}</div>`; }).join('');
    $('#hs',el).innerHTML = `<span class="hstat"><i style="--c:#38BDF8"></i>${t('최근 1시간 예측')} <b>${fmt(tot)}</b></span><span class="hstat"><i style="--c:#FB7185"></i>${t('NG 예측')} <b>${ng}</b></span><span class="hstat"><i style="--c:#34D399"></i>${t('PLC 일치율')} <b>${((1-mis/tot)*100).toFixed(1)}%</b></span><span class="hstat"><i style="--c:#FBBF24"></i>${t('연결 설비')} <b>13</b></span>`;
    $$('select[data-d]',el).forEach(x=>x.onchange=()=>{ S[x.dataset.n]=x.value; draw(); });
    $$('[data-open]',el).forEach(a=>a.onclick=e=>{ e.preventDefault(); openScreen(a.dataset.open); });
  };
  draw(); timers.push(setInterval(draw, 60000));
  $('[data-b=now]',el).onclick=()=>{ draw(); toast(t('최신 데이터로 갱신했습니다.')); };
  $('[data-help]',el).onclick=()=>help(DASH);
  return el;
}

/* ---------- 알림 ---------- */
function notices(){
  const items = PROC.flatMap(p => (p.equips||[null]).slice(0,3).map(eq => { const recs=lastHour(p.k,eq); const ngs=recs.filter(r=>r.pred==='NG'); return ngs.length?{p, eq, n:ngs.length, last:ngs[ngs.length-1]}:null; })).filter(Boolean).slice(0,8);
  const md = modal(t('NG 예측 알림'), items.length ? `<div class="alerts">${items.map((x,i)=>`<div class="alert" data-i="${i}" style="--sc:var(--crit)"><span class="sev"></span><div><b>${t('{p} {e} NG 예측 {n}건',{p:t(x.p.name), e:x.eq||t('라인'), n:x.n})}</b><p>${t('최근 1시간 · 마지막 {t}',{t:hm(x.last.TO_TIME)})}</p></div><span class="pill p-crit">NG</span></div>`).join('')}</div>` : emptyBox('최근 1시간 NG 예측이 없습니다.'), `<button type="button" class="btn primary" data-close="1">${t('확인')}</button>`);
  $$('.alert',md.el).forEach(a=>a.onclick=()=>{ const x=items[+a.dataset.i]; md.close(); if(x.eq) st(`${x.p.k}-01`).equip=x.eq; openScreen(`${x.p.k}-01`); });
}

    <button class="btn primary" type="button" id="lgo">${t('로그인')}</button></div>
    <div class="foot">${t('시연용 목업입니다. 화면의 데이터는 모두 가상 데이터입니다.')}</div></div>`;
